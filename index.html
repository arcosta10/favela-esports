function savePlayer(){
  const nick=document.getElementById('p-nick').value.trim();
  if(!nick){alert('Informe o nickname.');return}
  const tempId = Date.now();
  const newAvatarData = window._pendingAvatar||'';
  window._pendingAvatar=null;
  const newPlayer = {
    id:tempId, nick, ativo:true,
    full_name: document.getElementById('p-fullname')?.value.trim()||'',
    role_in_team: document.getElementById('p-role')?.value||'',
    joined_at: document.getElementById('p-joined')?.value||'',
    player_status: document.getElementById('p-status')?.value||'ativo',
    bio: document.getElementById('p-bio')?.value.trim()||'',
    social_links: document.getElementById('p-social')?.value.trim()||'',
    admin_notes: document.getElementById('p-notes')?.value.trim()||'',
    avatar_url: ''
  };
  PLAYERS.push(newPlayer);
  saveCache(); closeModal(); renderPage('players', true);
  // Upload avatar em background após fechar modal
  if(newAvatarData && newAvatarData.startsWith('data:')){
    ghUploadAvatar(tempId, newAvatarData).then(url=>{
      PLAYERS = PLAYERS.map(p=>+p.id===+tempId?{...p,avatar_url:url}:p);
      saveCache(); syncBg(()=>persistAll());
      showToast('✅ Jogador criado e foto enviada!','success');
    }).catch(e=>{
      console.warn('Avatar upload no savePlayer falhou:',e.message);
      syncBg(()=>persistAll());
      showToast('✅ Jogador criado (foto não enviada: '+e.message+')','warn',6000);
    });
  } else {
    syncBg(()=>persistAll());
  }
}
function modalEditPlayer(id,nick){
  if(!isAdmin()){alert('Sem permissão.');return;}

  window._pendingAvatar=null;
  const roleOpts=['','IGL/Homem Livre','Frente','Suporte','Homem livre','Segundo homen','Cafe com leite'].map(r=>`<option value="${r}" ${p.role_in_team===r?'selected':''}>${r||'Selecione...'}</option>`).join('');
  const statusOpts=['ativo','reserva','inativo'].map(s=>`<option value="${s}" ${(p.player_status||'ativo')===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('');
  const avatarSrc=getAvatarSrc(p);

  <div style="display:grid;grid-template-columns:auto 1fr;gap:20px;margin-bottom:12px;align-items:start">
    <div>
      <div style="width:80px;height:80px;min-width:80px;min-height:80px;border-radius:50%;background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(0,0,0,0));border:2px solid rgba(255,215,0,0.35);overflow:hidden;margin-bottom:8px;${avatarSrc?'':'display:flex;align-items:center;justify-content:center'}" id="ep-avatar-preview">
        ${avatarSrc?`<img src="${avatarSrc}" style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block;">`:
        `<span style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:var(--gold)">${nick.replace('FV ','').slice(0,2).toUpperCase()}</span>`}
      </div>
      <input type="file" id="ep-avatar-file" accept="image/jpg,image/jpeg,image/png,image/webp" style="display:none" onchange="previewAvatar(this)">
      <button class="btn btn-ghost" style="font-size:9px;width:80px;padding:4px" onclick="document.getElementById('ep-avatar-file').click()"><i class="fas fa-camera"></i> Foto</button>
      ${avatarSrc?`<button class="btn btn-ghost" style="font-size:9px;width:80px;padding:4px;margin-top:4px;color:var(--red)" onclick="removeAvatar()"><i class="fas fa-times"></i> Remover</button>`:''}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg" style="grid-column:1/-1"><label>Nickname *</label><input type="text" class="finput" id="ep-nick" value="${nick}"></div>
      <div class="fg"><label>Nome Completo</label><input type="text" class="finput" id="ep-fullname" value="${p.full_name||''}" placeholder="Nome real (opcional)"></div>
      <div class="fg"><label>Função no Time</label><select class="fselect" id="ep-role">${roleOpts}</select></div>
      <div class="fg"><label>Data de Entrada</label><input type="date" class="finput" id="ep-joined" value="${p.joined_at||''}"></div>

  `<button class="btn btn-ghost" type="button" ontouchend="closeModal()" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="btn-save-profile" type="button" ontouchend="updPlayer(${id})" onclick="updPlayer(${id})" style="min-height:44px;touch-action:manipulation"><i class="fas fa-save"></i> Salvar Perfil</button>`)

function previewAvatar(input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  if(file.size>3*1024*1024){alert('Arquivo muito grande. Máximo 3MB.');input.value='';return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    const src=ev.target.result;
    window._pendingAvatar=src;
    const prev=document.getElementById('ep-avatar-preview');
    if(prev){
      prev.style.display='block';
      prev.innerHTML='<img src="'+src+'" style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block;">';
    }
  };
  reader.readAsDataURL(file);
}

function removeAvatar(){
  window._pendingAvatar='__remove__';
  const prev=document.getElementById('ep-avatar-preview');
  if(prev){
    const nick=document.getElementById('ep-nick')?.value||'';
    prev.style.display='flex';
    prev.style.alignItems='center';
    prev.style.justifyContent='center';
    prev.innerHTML='<span style="font-family:Barlow Condensed,sans-serif;font-size:24px;font-weight:900;color:var(--gold)">'+nick.replace('FV ','').slice(0,2).toUpperCase()+'</span>';
  }
}

async function updPlayer(id){
  // ── Segurança ──
  if(!isAdmin()){alert('Sem permissão.');return;}

  // ── Prevenir duplo clique ──
  const btn = document.querySelector('#mFtr .btn-primary');
  if(btn && btn.disabled) return;
  if(btn){ btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Salvando...'; }

  // ── Captura de dados do formulário ──
  const nick     = (document.getElementById('ep-nick')?.value||'').trim();
  const fullName = (document.getElementById('ep-fullname')?.value||'').trim();
  const role     = document.getElementById('ep-role')?.value||'';
  const joined   = document.getElementById('ep-joined')?.value||'';
  const status   = document.getElementById('ep-status')?.value||'ativo';
  const bio      = (document.getElementById('ep-bio')?.value||'').trim();
  const social   = (document.getElementById('ep-social')?.value||'').trim();
  const notes    = (document.getElementById('ep-notes')?.value||'').trim();

  if(!nick){
    alert('Informe o nickname.');
    if(btn){ btn.disabled=false; btn.innerHTML='<i class="fas fa-save"></i> Salvar Perfil'; }
    return;
  }

  // ── Jogador atual (para manter avatar_url caso não mude) ──
  const currentPlayer = PLAYERS.find(p=>+p.id===+id)||{};
  const pendingAction = window._pendingAvatar; // base64 | '__remove__' | null

  try {
    let newAvatarUrl = currentPlayer.avatar_url||''; // mantém URL existente por padrão

    if(pendingAction === '__remove__'){
      // Remover avatar: deleta arquivo do GitHub e limpa URL
      if(btn) btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Removendo foto...';
      await ghDeleteAvatar(id);
      newAvatarUrl = '';
      console.log('[updPlayer] avatar removido do GitHub');

    } else if(pendingAction && pendingAction.startsWith('data:')){
      // Nova foto: upload real para o GitHub → URL pública
      if(btn) btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Enviando foto...';
      newAvatarUrl = await ghUploadAvatar(id, pendingAction);
      console.log('[updPlayer] avatar enviado para GitHub:', newAvatarUrl);
    }

    // ── Atualiza array PLAYERS com URL pública (não base64) ──
    PLAYERS = PLAYERS.map(p=>{
      if(+p.id!==+id) return p;
      return { ...p, nick, full_name:fullName, role_in_team:role, joined_at:joined,
               player_status:status, bio, social_links:social, admin_notes:notes,
               avatar_url: newAvatarUrl };
    });

    window._pendingAvatar = null;

    if(btn) btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Sincronizando...';
    saveCache();

    // Persiste tudo no GitHub (avatar_url agora é URL pública, não base64)
    await persistAll();

    closeModal();
    renderPage('players', true);
    showToast('✅ Perfil salvo e sincronizado!', 'success');

  } catch(err){
    console.error('[updPlayer] ERRO:', err);
    showToast('❌ Erro ao salvar: '+err.message, 'warn', 7000);
    if(btn){ btn.disabled=false; btn.innerHTML='<i class="fas fa-save"></i> Salvar Perfil'; }
  }
}
function delPlayer(id){
  if(!isAdmin()){alert('Sem permissão.');return;}
  if(!confirm('Excluir jogador?'))return;
  PLAYERS = PLAYERS.filter(p=>+p.id!==+id);
  saveCache(); renderPage('players', true);
  syncBg(()=>persistAll());
}

  `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveEvent()"><i class="fas fa-save"></i> Salvar</button>`)}

  const ev={id:Date.now(),titulo:t,data:d,tipo:document.getElementById('ev-tp').value,descricao:document.getElementById('ev-desc').value.trim()};

  syncBg(()=>persistAll());
}
function modalEditEvent(id){

function updEvent(id){
  const titulo=document.getElementById('ev-t').value.trim();
  const data=document.getElementById('ev-d').value;
  const tipo=document.getElementById('ev-tp').value;
  const descricao=document.getElementById('ev-desc').value.trim();
  EVENTS=EVENTS.map(e=>+e.id===+id?{...e,titulo,data,tipo,descricao}:e);
  saveCache(); closeModal(); renderPage('calendar', true);
  syncBg(()=>persistAll());
}
function delEvent(id){
  if(!confirm('Excluir evento?'))return;
  EVENTS=EVENTS.filter(e=>+e.id!==+id);
  saveCache(); renderPage('calendar', true);
  syncBg(()=>persistAll());
}
function showDayEvs(ds){
  const evs=EVENTS.filter(e=>e.data===ds);if(!evs.length)return;
  openModal(`Eventos - ${ds}`,evs.map(e=>`<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)"><b style="font-family:'Barlow Condensed',sans-serif;font-size:16px">${e.titulo}</b> <span class="badge badge-apto">${e.tipo}</span><div style="color:var(--gray);font-size:12px;margin-top:4px">${e.descricao||'-'}</div></div>`).join(''));
}
