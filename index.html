<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAVELA E-Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#000000;--bg:#080808;--bg1:#0D0D0D;--bg2:#111111;--bg3:#161616;
  --surface:#1a1a1a;--purple:#6D28D9;--purple2:#B8860B;--purple-g:#FFD700;
  --blue:#1D4ED8;--blue2:#B8860B;--blue-g:#FFD700;--accent:#FFD700;
  --cyan:#FFD700;--white:#FFFFFF;--off:#E5E5E5;--gray:#888888;--dim:#444444;
  --green:#10B981;--red:#EF4444;--gold:#FFD700;--gold2:#B8860B;--gold3:#FFC200;
  --border:rgba(184,134,11,0.2);--border2:rgba(255,215,0,0.35);
}
body{background:var(--bg);color:var(--white);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,h5{font-family:'Barlow Condensed',sans-serif;letter-spacing:0.02em}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,215,0,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,215,0,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),var(--gold),var(--gold2),transparent);z-index:200}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--black)}
::-webkit-scrollbar-thumb{background:var(--gold2);border-radius:2px}
.hidden{display:none!important}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1000;overflow:hidden}
.login-orb{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(184,134,11,0.1) 0%,transparent 65%);pointer-events:none}
.login-orb.b{background:radial-gradient(circle,rgba(255,215,0,0.06) 0%,transparent 65%);right:0;bottom:0}
.login-card{position:relative;z-index:1;width:420px;border:1px solid rgba(255,215,0,0.3);border-top:2px solid var(--gold);overflow:hidden;box-shadow:0 0 60px rgba(184,134,11,0.15)}
.login-top{background:linear-gradient(180deg,rgba(184,134,11,0.12) 0%,rgba(0,0,0,0) 100%);padding:36px 40px 28px;border-bottom:1px solid rgba(255,215,0,0.2);text-align:center}
.login-title{font-size:30px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;color:#fff}
.login-sub{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold2);margin-top:6px}
.login-body{background:#0a0a0a;padding:28px 40px 32px}
.login-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#FCA5A5;border-radius:2px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;letter-spacing:0.03em}
.login-error.show{display:block}
.fl{margin-bottom:16px}
.fl label{display:block;font-size:10px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold2);margin-bottom:7px}
.fl input,.fl select{width:100%;background:#111;border:1px solid rgba(255,215,0,0.18);border-radius:2px;padding:11px 14px;color:var(--white);font-size:14px;font-family:'Barlow',sans-serif;outline:none;transition:border-color 0.2s}
.fl input:focus,.fl select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,0,0.08)}
.fl select option{background:var(--bg2)}
.btn-login{width:100%;background:linear-gradient(135deg,var(--gold2),var(--gold));border:none;padding:13px;color:#000;font-size:13px;font-weight:800;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.2s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-login:hover{background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 0 20px rgba(255,215,0,0.3)}
.btn-login.loading{opacity:0.7;pointer-events:none}
.login-hint{text-align:center;font-size:11px;color:rgba(255,215,0,0.4);margin-top:14px;letter-spacing:0.05em}

/* TYPE SELECTOR */
.type-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.type-btn{padding:10px;border:1px solid rgba(255,215,0,0.2);background:transparent;color:var(--gray);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.15s}
.type-btn.active{border-color:var(--gold);background:rgba(184,134,11,0.2);color:var(--gold)}

/* APP */
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:220px;background:#0a0a0a;border-right:1px solid rgba(255,215,0,0.15);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sb-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.nav{flex:1;padding:18px 10px;overflow-y:auto}
.nav-sec{margin-bottom:22px}
.nav-sec-label{font-size:9px;color:var(--gold2);letter-spacing:0.2em;text-transform:uppercase;padding:0 10px;margin-bottom:8px;font-family:'Barlow Condensed',sans-serif;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:2px;cursor:pointer;color:var(--gray);font-size:13px;font-weight:500;transition:all 0.15s;position:relative;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;letter-spacing:0.03em}
.ni:hover{color:var(--gold);background:rgba(184,134,11,0.08)}
.ni.active{color:var(--gold);background:rgba(184,134,11,0.12);border-left:2px solid var(--gold)}
.ni i{width:15px;text-align:center;font-size:13px}
.sb-footer{padding:12px;border-top:1px solid var(--border)}
.admin-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#111;border-radius:2px;border:1px solid rgba(255,215,0,0.15)}
.admin-av{width:26px;height:26px;background:linear-gradient(135deg,var(--gold2),var(--gold));border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.05em;flex-shrink:0;color:#000}
.admin-nm{font-size:12px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.05em}
.admin-rl{font-size:10px;color:var(--gray);letter-spacing:0.05em}
.btn-logout{background:none;border:none;color:var(--gray);cursor:pointer;font-size:12px;margin-left:auto}
.btn-logout:hover{color:var(--red)}
.main{margin-left:220px;flex:1;min-width:0}
.topbar{height:52px;background:#080808;border-bottom:1px solid rgba(255,215,0,0.15);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:50}
.tb-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;flex:1;letter-spacing:0.08em;text-transform:uppercase}
.tb-badge{background:transparent;border:1px solid rgba(255,215,0,0.3);padding:3px 12px;border-radius:2px;font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold)}
.tb-sync{font-size:11px;color:var(--gray);display:flex;align-items:center;gap:5px}
.tb-sync.ok{color:var(--gold)}
.tb-sync.err{color:var(--gold)}
.content{padding:28px;min-height:calc(100vh - 52px)}

/* CARDS */
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:28px}
.sc{background:#0d0d0d;border:1px solid rgba(255,215,0,0.12);border-top:2px solid var(--sc-color,var(--gold));padding:16px 20px;position:relative;overflow:hidden}
.sc::after{content:'';position:absolute;bottom:0;right:0;width:60px;height:60px;background:radial-gradient(circle,var(--sc-color,rgba(109,40,217,0.2)) 0%,transparent 70%)}
.sc-label{font-size:10px;color:var(--gray);letter-spacing:0.15em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.sc-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;line-height:1;letter-spacing:0.02em}
.sc-sub{font-size:11px;color:var(--gray);margin-top:5px;letter-spacing:0.03em}
.sc-ico{position:absolute;top:14px;right:16px;font-size:18px;opacity:0.25}

/* TABLES */
.tw{background:#0d0d0d;border:1px solid rgba(255,215,0,0.12);margin-bottom:24px}
.tw-hdr{padding:12px 20px;border-bottom:1px solid rgba(255,215,0,0.12);display:flex;align-items:center;justify-content:space-between;background:#111}
.tw-hdr h3{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:9px 16px;text-align:left;font-size:10px;font-weight:700;color:var(--gold2);text-transform:uppercase;letter-spacing:0.12em;background:#111;border-bottom:1px solid rgba(255,215,0,0.12)}
.tbl td{padding:9px 16px;font-size:13px;border-bottom:1px solid rgba(255,215,0,0.05)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,215,0,0.04)}
.r1{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:var(--gold)}
.r2{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:#94A3B8}
.r3{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:#CD7C32}
.rn{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--gray)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.badge-apto{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.3)}
.badge-napto{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.badge-map{padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:0.06em}
.map-Erangel{background:rgba(0,208,132,0.13);color:#00D084;border:1px solid rgba(0,208,132,0.35)}
.map-Miramar{background:rgba(255,107,53,0.13);color:#FF6B35;border:1px solid rgba(255,107,53,0.35)}
.map-Rondo{background:rgba(255,215,0,0.13);color:#FFD700;border:1px solid rgba(255,215,0,0.35)}
.map-Sanhok{background:rgba(0,184,255,0.13);color:#00B8FF;border:1px solid rgba(0,184,255,0.35)}
.map-Vikendi{background:rgba(138,92,255,0.13);color:#8A5CFF;border:1px solid rgba(138,92,255,0.35)}
.map-Livik{background:rgba(255,77,148,0.13);color:#FF4D94;border:1px solid rgba(255,77,148,0.35)}
.map-Taego{background:rgba(255,255,255,0.08);color:#FFFFFF;border:1px solid rgba(255,255,255,0.3)}
.score-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--gold)}

/* FORMS */
.fg{margin-bottom:16px}
.fg label{display:block;font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold2);margin-bottom:7px}
.finput{width:100%;background:#111;border:1px solid rgba(255,215,0,0.18);padding:10px 13px;color:var(--white);font-size:13px;font-family:'Barlow',sans-serif;outline:none;transition:border-color 0.2s;border-radius:2px}
.finput:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,0,0.08)}
.fselect{width:100%;background:#111;border:1px solid rgba(255,215,0,0.18);padding:10px 13px;color:var(--white);font-size:13px;font-family:'Barlow',sans-serif;outline:none;cursor:pointer;border-radius:2px}
.fselect:focus{border-color:var(--gold)}
.fselect option{background:var(--bg2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.fcard{background:#0d0d0d;border:1px solid rgba(255,215,0,0.12);padding:22px;margin-bottom:20px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.15s;border-radius:2px;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,215,0,0.15);min-height:40px}
.btn-primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#000;padding:9px 18px;font-size:12px;font-weight:800}
.btn-primary:hover{background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 0 16px rgba(255,215,0,0.2)}
.btn-ghost{background:transparent;border:1px solid rgba(255,215,0,0.25);color:var(--gray);padding:8px 14px;font-size:11px}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:var(--red);padding:6px 10px;font-size:11px}
.btn-icon{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#000;padding:6px 10px;font-size:11px;font-weight:800}

/* PROGRESS */
.pbar{background:var(--bg2);height:4px;margin-top:5px}
.pfill{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width 0.4s}
.pfill.full{background:var(--green)}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,215,0,0.15);margin-bottom:22px}
.tab{padding:10px 20px;border:none;background:transparent;color:var(--gray);font-size:12px;font-weight:700;cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.12em;text-transform:uppercase;border-bottom:2px solid transparent;transition:all 0.15s;margin-bottom:-1px}
.tab:hover{color:var(--gold)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(3,6,13,0.88);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal{background:#0d0d0d;border:1px solid rgba(255,215,0,0.3);border-top:2px solid var(--gold);width:100%;max-width:640px;box-shadow:0 0 40px rgba(184,134,11,0.12);display:flex;flex-direction:column;margin:auto}
.modal-hdr{padding:16px 20px;border-bottom:1px solid rgba(255,215,0,0.15);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-hdr h2{font-size:16px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase}
.modal-x{background:none;border:none;color:var(--gray);font-size:16px;cursor:pointer;padding:4px 8px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-ftr{padding:12px 20px;border-top:1px solid rgba(255,215,0,0.12);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;flex-wrap:wrap;background:#0d0d0d}

/* UPLOAD */
.upload-zone{border:1px dashed rgba(255,215,0,0.2);padding:20px;text-align:center;cursor:pointer;transition:border-color 0.2s;background:#111;border-radius:2px}
.upload-zone:hover{border-color:var(--gold)}
.upload-zone i{font-size:22px;color:var(--gray);display:block;margin-bottom:6px}
.upload-zone p{font-size:11px;color:var(--gray);letter-spacing:0.05em}
.upload-zone.done{border-color:var(--green);border-style:solid}

/* EMPTY */
.empty{text-align:center;padding:64px 24px;color:var(--gray)}
.empty i{font-size:44px;display:block;margin-bottom:16px;opacity:0.15}
.empty h3{font-size:18px;font-weight:800;letter-spacing:0.06em;margin-bottom:6px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--gray)}
.empty p{font-size:13px;opacity:0.6}

/* PLAYER CARDS */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{background:#0d0d0d;border:1px solid rgba(255,215,0,0.12);border-top:2px solid var(--pc-color,var(--gold));padding:16px 18px}
.pcard-nick{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:16px}
.cal-hdr{text-align:center;padding:8px 4px;font-size:9px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.15em;font-family:'Barlow Condensed',sans-serif}
.cal-day{background:#111;padding:8px 6px;min-height:58px;cursor:pointer;transition:background 0.15s;border:1px solid transparent}
.cal-day:hover{background:#161616;border-color:rgba(255,215,0,0.2)}
.cal-day.today{border-color:var(--gold)}
.cal-day.has-ev{border-color:rgba(255,215,0,0.35)}
.cal-dn{font-weight:600;margin-bottom:3px;color:var(--gray);font-family:'Barlow Condensed',sans-serif;font-size:13px}
.cal-day.today .cal-dn{color:var(--purple-g)}
.cal-dot{background:rgba(184,134,11,0.25);padding:2px 4px;font-size:8px;color:var(--gold);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:0.04em}

/* SPINNER */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,215,0,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 18px;border-radius:3px;font-size:13px;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:0.04em;display:flex;align-items:center;gap:8px;pointer-events:auto;animation:toastIn 0.25s ease;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.toast.success{background:#0d0d0d;border:1px solid rgba(0,208,132,0.4);color:#00D084}
.toast.warn{background:#0d0d0d;border:1px solid rgba(255,107,53,0.4);color:#FF6B35}
.toast.info{background:#0d0d0d;border:1px solid rgba(255,215,0,0.3);color:var(--gold)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ALERT */
.alert{padding:11px 16px;font-size:13px;letter-spacing:0.03em;margin-bottom:16px;border-radius:2px}
.alert-info{background:rgba(184,134,11,0.06);border:1px solid rgba(255,215,0,0.2);color:var(--gold)}
.alert-success{background:rgba(184,134,11,0.08);border:1px solid rgba(255,215,0,0.25);color:var(--gold)}

/* TP CARD */
.tp-card{background:linear-gradient(135deg,rgba(184,134,11,0.1),rgba(0,0,0,0));border:1px solid rgba(255,215,0,0.2);padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:8px}
.tp-num{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;line-height:1;color:var(--dim);letter-spacing:-0.02em}
.tp-num.gold{color:var(--gold)}
.tp-nick{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em}
.tp-info{font-size:12px;color:var(--gray);margin-top:2px;letter-spacing:0.03em}

/* TOP 3 MOBILE — cards horizontais em linha */
@media(max-width:768px){
  /* MODAL mobile */
  .overlay{padding:8px;align-items:flex-start}
  .modal{max-height:none;width:100%;margin:0 auto}
  .modal-body{padding:14px}
  .modal-hdr{padding:12px 14px}
  .modal-hdr h2{font-size:13px}
  .modal-ftr{padding:10px 14px}
  .modal-ftr .btn{min-height:44px;font-size:12px;flex:1;justify-content:center}
  /* Grids do formulário viram coluna única no mobile */
  .modal-body [style*="grid-template-columns:1fr 1fr"],
  .modal-body [style*="grid-template-columns: 1fr 1fr"],
  .modal-body [style*="grid-template-columns:auto 1fr"]{display:flex!important;flex-direction:column!important;gap:10px!important}
  /* Avatar no topo centralizado no mobile */
  .modal-body [style*="width:80px;height:80px;border-radius:50%"]{margin:0 auto 8px!important}

  /* PERFIL mobile - container principal */
  .pf-root{width:100%!important;max-width:100%!important;padding:0!important;overflow-x:hidden!important}
  .pf-header-card{padding:16px!important}
  .pf-header-inner{flex-direction:column!important;align-items:center!important;text-align:center!important;gap:12px!important}
  .pf-avatar{width:90px!important;height:90px!important;min-width:90px!important;min-height:90px!important;flex-shrink:0!important;overflow:hidden!important;border-radius:50%!important}
  .pf-info{min-width:0!important;width:100%!important}
  .pf-info-badges{justify-content:center!important}
  .pf-ranking-row{justify-content:center!important;margin-top:12px!important}
  /* Grids de estatísticas gerais: 2 colunas */
  .pf-stats-grid{grid-template-columns:repeat(2,1fr)!important}
  /* Score + Mapa: coluna única */
  .pf-score-map-grid{grid-template-columns:1fr!important}
  /* Composição interna: 1 coluna */
  .pf-composition-grid{grid-template-columns:1fr!important}
  /* Gráficos: 1 coluna */
  .pf-charts-grid{grid-template-columns:1fr!important}
  .chart-card{width:100%!important;min-width:0!important;margin-bottom:12px!important}
  /* Conquistas: 2 colunas */
  .pf-achievements-grid{grid-template-columns:repeat(2,1fr)!important}
  /* Filtros de período: wrap */
  .pf-filter-row{flex-wrap:wrap!important;gap:4px!important}
  /* Stats de mapa por coluna */
  .pf-map-stat-grid{grid-template-columns:repeat(2,1fr)!important;gap:4px!important}

  /* PERFIL mobile - IDs legados */
  #pf-grid-stats{grid-template-columns:repeat(2,1fr)!important}
  #pf-grid-score{grid-template-columns:1fr!important}
  #pf-grid-charts{grid-template-columns:1fr!important}

  /* Grid vira coluna única: Top3 acima, gráfico abaixo */
  .dash-top3-grid{display:flex!important;flex-direction:column!important;gap:12px!important}
  .top3-col,.chart-col{width:100%}

  /* Top3: 3 cards lado a lado em linha */
  .top3-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tp-card{flex-direction:column;align-items:center;text-align:center;padding:10px 6px;gap:3px;margin-bottom:0;border-radius:2px}

  /* Tipografia compacta */
  .tp-num{font-size:0;line-height:0;margin:0;padding:0}
  .tp-medal{font-size:22px;line-height:1;display:block}
  .tp-nick{font-size:13px;font-weight:800;letter-spacing:0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tp-info{display:none}
  .tp-score-big{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;color:var(--gold);line-height:1.1}
  .tp-card .badge{font-size:8px;padding:2px 5px;margin-top:2px}

  /* Gráfico ocupa largura total */
  .chart-col .chart-card{margin:0;padding:12px}
  .chart-col .chart-card > div{height:170px!important}
}
@media(min-width:769px){
  .top3-list{display:block}
  .tp-medal{display:none}
  .tp-score-big{display:none}
}
.chart-card{background:#0d0d0d;border:1px solid rgba(255,215,0,0.12);padding:20px;margin-bottom:20px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec-title-line{width:3px;height:20px;background:linear-gradient(to bottom,var(--gold),var(--gold2))}
.rp-section{background:#0d0d0d;border:1px solid rgba(255,215,0,0.12);margin-bottom:12px}
.rp-hdr{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,215,0,0.1);background:linear-gradient(90deg,rgba(184,134,11,0.08),transparent)}
.rp-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase}
.rp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.rp-stat{padding:10px 16px;border-right:1px solid rgba(255,215,0,0.08)}
.rp-stat:last-child{border-right:none}
.rp-stat-label{font-size:9px;color:var(--gray);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:3px}
.rp-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700}

/* VIEW ONLY BANNER */
.view-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(184,134,11,0.08);border:1px solid rgba(255,215,0,0.2);font-size:12px;color:var(--gold);letter-spacing:0.05em;margin-bottom:18px}

/* ── AVATAR — regras globais ── */
.pf-avatar{width:90px!important;height:90px!important;min-width:90px!important;min-height:90px!important;border-radius:50%!important;overflow:hidden!important;flex-shrink:0!important;}
.pf-avatar img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important;display:block!important;flex:none!important;}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform 0.25s;z-index:300}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .content{padding:16px;overflow-x:hidden}
  .cards-row{grid-template-columns:repeat(2,1fr)}
  .topbar{padding:0 16px}
  .menu-btn{display:flex!important}
}
.menu-btn{display:none;background:none;border:none;color:var(--white);font-size:18px;cursor:pointer;padding:4px;margin-right:8px}
</style>

// Lê o db.json do GitHub
async function ghRead() {
  const r = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`, {
    headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (r.status === 404) return null; // arquivo ainda não existe
  if (!r.ok) throw new Error('GitHub read failed: ' + r.status);
  const json = await r.json();
  _ghSha = json.sha;
  const decoded = atob(json.content.split('\n').join(''));
  return JSON.parse(decoded);
}

// Salva o db.json no GitHub (cria ou atualiza)
// Retry automático se SHA estiver desatualizado (conflito multi-dispositivo)
async function ghWrite(data, retryCount=0) {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = { message: 'update db ' + Date.now(), content };
  if (_ghSha) body.sha = _ghSha;
  const r = await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`, {
    method: 'PUT',
    headers: {
      'Authorization': 'token ' + GH_TOKEN,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  // 422 = SHA desatualizado (outro dispositivo escreveu antes)
  // Solução: buscar SHA atual do GitHub, fazer merge e tentar de novo (máx 3x)
  if (r.status === 422 && retryCount < 3) {
    console.warn('[ghWrite] SHA desatualizado, buscando SHA atual e fazendo merge...');
    const remote = await ghRead(); // atualiza _ghSha com valor real
    if (remote) {
      // Merge: dados remotos + dados locais (local tem prioridade)
      const merged = {
        jogadores: data.jogadores,
        partidas : data.partidas,
        eventos  : data.eventos,
        _nextId  : Math.max(data._nextId || 0, remote._nextId || 0),
      };
      return ghWrite(merged, retryCount + 1);
    }
  }

  if (!r.ok) { const t = await r.text(); throw new Error('GitHub write failed: ' + t); }
  const res = await r.json();
  _ghSha = res.content?.sha || _ghSha;
}

// SCORE CALC — normalizado por período
// Pesos ajustáveis aqui:
const SCORE_WEIGHTS = { dano: 2, salvamentos: 2, kills: 1, suportes: 0.5 };
// ============================================================

// Retorna estatísticas brutas de um jogador em um conjunto de partidas
function pStats(pid, matchList){
  const ms = matchList || MATCHES;
  let dano=0,kills=0,salv=0,sup=0,col=0,n=0;
  ms.forEach(m=>(m.estatisticas||[]).forEach(s=>{
    if(+s.jogador_id===+pid){dano+=+s.dano;kills+=+s.kills;salv+=+s.salvamentos;sup+=+s.suportes;col+=+s.colocacao;n++}
  }));
  return{dano,kills,salv,sup,col,n};
}

// Calcula score normalizado de um conjunto de jogadores dentro de um período
// Retorna array de {player, st, medias, score}
function calcRanking(matchList){
  const ms = matchList || MATCHES;

  // 1. Calcula stats brutas de cada jogador
  const data = PLAYERS.map(p => {
    const st = pStats(p.id, ms);
    const n  = st.n;
    return {
      ...p,
      st,
      medias: {
        dano : n ? st.dano / n : 0,
        kills: n ? st.kills / n : 0,
        salv : n ? st.salv / n : 0,
        sup  : n ? st.sup  / n : 0,
        col  : n ? st.col  / n : 0,
      }
    };
  });

  // 2. Encontra o maior valor médio de cada stat (entre jogadores com partidas)
  const max = {
    dano : Math.max(...data.map(p => p.medias.dano)),
    kills: Math.max(...data.map(p => p.medias.kills)),
    salv : Math.max(...data.map(p => p.medias.salv)),
    sup  : Math.max(...data.map(p => p.medias.sup)),
  };

  // 3. Calcula score normalizado com os pesos + contribuições por categoria
  const W = SCORE_WEIGHTS;
  const SCORE_MAX = W.dano + W.salvamentos + W.kills + W.suportes; // 5.5
  data.forEach(p => {
    if(!p.st.n){ p.score=0; p.contrib={dano:0,salv:0,kills:0,sup:0}; return; }
    const norm = (val, maxVal) => maxVal > 0 ? val / maxVal : 0;
    const contrib = {
      dano  : parseFloat((norm(p.medias.dano,  max.dano)  * W.dano        ).toFixed(3)),
      salv  : parseFloat((norm(p.medias.salv,  max.salv)  * W.salvamentos ).toFixed(3)),
      kills : parseFloat((norm(p.medias.kills, max.kills) * W.kills       ).toFixed(3)),
      sup   : parseFloat((norm(p.medias.sup,   max.sup)   * W.suportes    ).toFixed(3)),
    };
    p.contrib = contrib;
    p.score   = parseFloat((contrib.dano + contrib.salv + contrib.kills + contrib.sup).toFixed(2));
    p.scorePct = parseFloat((p.score / SCORE_MAX * 100).toFixed(1));
    p.scoreDisplay = scoreToDisplay(p.score);
    p.scoreStatus = scoreDisplayStatus(p.scoreDisplay);
  });

  // 4. Ordena por score desc
  return data.sort((a,b) => b.score - a.score || b.medias.dano - a.medias.dano);
}

// Converte score bruto (0–5.5) para nota exibida (0–10) por faixas proporcionais
function scoreToDisplay(s){
  if(s >= 5.00) return parseFloat((9.0 + (s - 5.00) / (5.50 - 5.00) * 1.0).toFixed(2));  // 5.00–5.50 → 9.0–10.0
  if(s >= 4.00) return parseFloat((6.0 + (s - 4.00) / (4.99 - 4.00) * 2.99).toFixed(2)); // 4.00–4.99 → 6.0–8.99
  if(s >= 2.00) return parseFloat((2.0 + (s - 2.00) / (3.99 - 2.00) * 3.99).toFixed(2)); // 2.00–3.99 → 2.0–5.99
  return parseFloat((s / 1.99 * 1.99).toFixed(2));                                         // 0.00–1.99 → 0.0–1.99
}

// Label e cor baseados na nota exibida (0–10)
function scoreDisplayStatus(displayed){
  if(displayed >= 9.0) return {label:'Elite',         color:'#FFD700', bg:'rgba(255,215,0,0.15)'};
  if(displayed >= 8.0) return {label:'Pro',           color:'#00D084', bg:'rgba(0,208,132,0.12)'};
  if(displayed >= 6.0) return {label:'Avançado',      color:'#00B8FF', bg:'rgba(0,184,255,0.12)'};
  if(displayed >= 4.0) return {label:'Intermediário', color:'#FF6B35', bg:'rgba(255,107,53,0.12)'};
  if(displayed >= 2.0) return {label:'Iniciante',     color:'#EF4444', bg:'rgba(239,68,68,0.12)'};
  return                      {label:'Novato',        color:'#888',    bg:'rgba(128,128,128,0.1)'};
}

// Filtros de período reutilizáveis
function getWeekFilter(){
  const now=new Date(); const d=now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-(d===0?6:d-1)); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  return MATCHES.filter(m=>{const dt=new Date(m.data);return dt>=mon&&dt<=sun;});
}
function getMonthFilter(){
  const ym=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
  return MATCHES.filter(m=>m.data?.startsWith(ym));
}

function getPlayerPositions(pid){

  return {
    geral   : posIn(calcRanking(MATCHES)),
    semanal : posIn(calcRanking(getWeekFilter())),
    mensal  : posIn(calcRanking(getMonthFilter())),
  };
}

let _lastGhSync = 0; // timestamp do último sync com GitHub
const GH_SYNC_TTL = 30000; // re-busca GitHub se passou mais de 30s

async function loadAll(force=false){
  const now = Date.now();
  // Usa cache local apenas se dados já existem E sync foi recente E não forçado
  if(!force && PLAYERS.length>0 && (now - _lastGhSync) < GH_SYNC_TTL){
    setSyncStatus('ok'); return;
  }

  // Carrega localStorage primeiro para resposta imediata
  try{
    const p=localStorage.getItem('fv_players');
    const m=localStorage.getItem('fv_matches');
    const ev=localStorage.getItem('fv_events');
    if(p && JSON.parse(p).length>0) PLAYERS=JSON.parse(p);
    if(m) MATCHES=JSON.parse(m);
    if(ev) EVENTS=JSON.parse(ev);
  }catch(e){}

  // Sincroniza com GitHub
  setSyncStatus('loading');
  try {
    const timeout = new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000));
    const db = await Promise.race([ghRead(), timeout]);
    if(db){
      if(db.jogadores?.length>0){ PLAYERS=db.jogadores; }
      if(db.partidas)  { MATCHES=db.partidas; }
      if(db.eventos)   { EVENTS=db.eventos; }
      // Atualiza localStorage com dados do GitHub
      localStorage.setItem('fv_players',JSON.stringify(PLAYERS));
      localStorage.setItem('fv_matches',JSON.stringify(MATCHES));
      localStorage.setItem('fv_events', JSON.stringify(EVENTS));
    }
    _lastGhSync = Date.now();
    setSyncStatus('ok');
  } catch(e){
    // GitHub falhou — dados do localStorage já estão carregados
    console.warn('GitHub sync falhou:', e.message);
    setSyncStatus('err');
  }
}

// ============================================================
// GITHUB IMAGE STORAGE — avatares salvos como arquivos no repo
// URL pública: https://raw.githubusercontent.com/{owner}/{repo}/main/Dados/avatars/{id}.jpg
// ============================================================
async function compressImage(dataUrl, maxSizeKB=150, quality=0.75){
  // Comprime e redimensiona a imagem para no máximo maxSizeKB KB
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX_DIM = 256; // pixels
      let w = img.width, h = img.height;
      if(w > MAX_DIM || h > MAX_DIM){
        if(w > h){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
        else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // Reduz qualidade até caber no limite
      let q = quality;
      let result = canvas.toDataURL('image/jpeg', q);
      while(result.length > maxSizeKB * 1366 && q > 0.3){ // ~1366 chars por KB em base64
        q -= 0.05;
        result = canvas.toDataURL('image/jpeg', q);
      }
      resolve(result);
    };
    img.src = dataUrl;
  });
}

async function ghUploadAvatar(playerId, dataUrl){
  // Faz upload da imagem como arquivo no repositório e retorna a URL pública
  const path = 'Dados/avatars/' + playerId + '.jpg';
  const publicUrl = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/main/' + path + '?v=' + Date.now();

  // Comprime antes de enviar
  const compressed = await compressImage(dataUrl);
  const base64Data = compressed.split(',')[1]; // remove o "data:image/jpeg;base64,"

  // Verifica se já existe (para pegar o SHA)
  let existingSha = null;
  try{
    const check = await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path, {
      headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json'}
    });
    if(check.ok){ const j = await check.json(); existingSha = j.sha; }
  }catch(e){}

  const body = { message:'avatar '+playerId+' '+Date.now(), content:base64Data };
  if(existingSha) body.sha = existingSha;

  const r = await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path, {
    method:'PUT',
    headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!r.ok){ const t = await r.text(); throw new Error('Upload avatar falhou: '+t); }
  return publicUrl;
}

async function ghDeleteAvatar(playerId){
  const path = 'Dados/avatars/' + playerId + '.jpg';
  try{
    const check = await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path, {
      headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json'}
    });
    if(!check.ok) return; // já não existe
    const j = await check.json();
    await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path, {
      method:'DELETE',
      headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body: JSON.stringify({ message:'remove avatar '+playerId, sha: j.sha })
    });
  }catch(e){ console.warn('ghDeleteAvatar:', e.message); }
}

    const p=localStorage.getItem('fv_players');
    const m=localStorage.getItem('fv_matches');
    const ev=localStorage.getItem('fv_events');
    if(p) PLAYERS=JSON.parse(p);
    if(m) MATCHES=JSON.parse(m);
    if(ev) EVENTS=JSON.parse(ev);
  }catch(e){}

  // 2. Verifica se existe sessão salva (F5 / reload)
  let savedSession = null;
  try{ const s=localStorage.getItem('fv_session'); if(s) savedSession=JSON.parse(s); }catch(e){}

  if(savedSession && savedSession.role){
    // ── Sessão encontrada — restaura sem pedir login ──
    CURRENT_USER = savedSession;
    console.log('[init] Sessão restaurada:', savedSession.role, savedSession.nick);

    // Recupera a última página visitada
    let savedPage = 'dashboard';
    try{ savedPage = localStorage.getItem('fv_current_page')||'dashboard'; }catch(e){}

    // Valida que a página é permitida para o role atual
    const adminOnlyPages = ['calendar','reports'];
    if(!isAdmin() && adminOnlyPages.includes(savedPage)) savedPage = 'dashboard';

    // Restaura o jogador visualizado (para page player-profile)
    try{
      const savedPid = localStorage.getItem('fv_viewing_player_id');
      if(savedPid) window._viewingPlayerId = +savedPid;
      else if(savedPage==='player-profile') savedPage='players';
    }catch(e){}

    openApp(savedPage);

    // Atualiza dados do GitHub em background (sem bloquear a UI)
    loadAll(true).then(()=>{
      // Re-renderiza a página atual com dados frescos
      const current = (() => { try{ return localStorage.getItem('fv_current_page')||'dashboard'; }catch(e){ return 'dashboard'; } })();
      renderPage(current, true);
    }).catch(e=>{ console.warn('[init] Sync em background falhou:', e.message); });

  } else {
    // ── Sem sessão — carrega jogadores para o select de login ──
    try{
      const db = await Promise.race([
        ghRead(),
        new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000))
      ]);
      if(db?.jogadores?.length>0){
        PLAYERS=db.jogadores;
        localStorage.setItem('fv_players',JSON.stringify(PLAYERS));
      }
    }catch(e){
      console.warn('[init] Pré-carregamento falhou:', e.message);
    }
    // Garante que a tela de login está visível
    loginScreen.classList.remove('hidden');
    appShell.classList.add('hidden');
  }
});

function goto(page,el){
  if(!isAdmin()&&['calendar','reports'].includes(page))return;
  if(page==='profile') window._viewingPlayerId = CURRENT_USER?.pid || null;
  try{ localStorage.setItem('fv_current_page', page); }catch(e){}
  document.querySelectorAll('.ni').forEach(i=>i.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  renderPage(page);
}

async function renderPage(page, skipSync=false){
  const titles={dashboard:'Dashboard',rankings:'Rankings',matches:'Partidas',history:'Histórico',calendar:'Calendário',players:'Jogadores',reports:'Relatórios',profile:'Meu Perfil','player-profile':'Perfil do Jogador'};
  document.getElementById('tb-title').textContent=titles[page]||page;
  Object.values(chartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  chartInstances={};
  if(!skipSync){
    document.getElementById('mainContent').innerHTML=`<div style="text-align:center;padding:60px"><span class="spinner" style="width:28px;height:28px;border-width:3px"></span></div>`;
    await loadAll();
  }
  const fn={dashboard:pgDashboard,rankings:pgRankings,matches:pgMatches,history:pgHistory,calendar:pgCalendar,players:pgPlayers,reports:pgReports,profile:pgProfile,'player-profile':()=>pgPlayerProfile(window._viewingPlayerId)};
  document.getElementById('mainContent').innerHTML=fn[page]?fn[page]():'';
  setTimeout(()=>initCharts(page),80);
}

async function reloadData(){
  await loadAll(true);
  const page = document.getElementById('tb-title').textContent.toLowerCase();
  const map = {'dashboard':'dashboard','rankings':'rankings','partidas':'matches','histórico':'history','calendário':'calendar','jogadores':'players','relatórios':'reports','meu perfil':'profile','perfil do jogador':'player-profile'};
  const fn={dashboard:pgDashboard,rankings:pgRankings,matches:pgMatches,history:pgHistory,calendar:pgCalendar,players:pgPlayers,reports:pgReports,profile:pgProfile,'player-profile':()=>pgPlayerProfile(window._viewingPlayerId)};
  const key = map[page]||'dashboard';
  Object.values(chartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  chartInstances={};
  document.getElementById('mainContent').innerHTML=fn[key]?fn[key]():'';
  setTimeout(()=>initCharts(key),80);
}

// Constrói tabela de ranking normalizado para um conjunto de partidas
function buildRankTbl(matchList, label, icon, color){
  if(!matchList.length) return`<div class="empty" style="padding:40px"><i class="fas ${icon}" style="color:${color}"></i><h3>${label}</h3><p>Nenhuma partida neste período.</p></div>`;
  const rk = calcRanking(matchList);
  const best = rk.find(p=>p.st.n>0);
  const getPeriodLabel=()=>{
    const now=new Date();
    if(label.includes('Semanal')){ const d=now.getDay(); const mon=new Date(now); mon.setDate(now.getDate()-(d===0?6:d-1)); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return `${mon.getDate()}/${mon.getMonth()+1} — ${sun.getDate()}/${sun.getMonth()+1}`; }
    if(label.includes('Mensal')){ const mn=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return `${mn[now.getMonth()]} ${now.getFullYear()}`; }
    return `${matchList.length} partida(s)`;
  };
  const W = SCORE_WEIGHTS;
  const scoreMax = W.dano + W.salvamentos + W.kills + W.suportes;
  return`<div class="tw">
    <div class="tw-hdr">
      <h3><i class="fas ${icon}" style="color:${color};margin-right:6px"></i>${label} <span style="color:var(--gray);font-size:11px;font-weight:400;letter-spacing:0.05em">${getPeriodLabel()}</span></h3>
      ${best?`<span style="font-size:12px;color:${color}"><i class="fas fa-crown" style="margin-right:4px"></i>MVP: <b>${best.nick}</b> — ${best.scoreDisplay} / 10</span>`:''}
    </div>
    <div style="background:rgba(255,215,0,0.04);padding:8px 16px;font-size:11px;color:var(--gray);border-bottom:1px solid rgba(255,215,0,0.08)">
      <i class="fas fa-info-circle" style="color:var(--gold2);margin-right:5px"></i>
      Pesos: Dano ×${W.dano} · Salvamentos ×${W.salvamentos} · Kills ×${W.kills} · Suportes ×${W.suportes} · Score máx: <b style="color:var(--gold)">${scoreMax}</b>
    </div>
    <div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>#</th><th>Jogador</th><th>Score</th><th>Nível</th><th>Dano/Pt</th><th>Kills/Pt</th><th>Salv./Pt</th><th>Sup./Pt</th><th>Col.Méd</th><th>Pts</th><th>Aptidão</th></tr></thead>
    <tbody>${rk.map((p,i)=>{
      const {st,medias,score:sc,scoreDisplay:scD,contrib,scorePct,scoreStatus} = p;
      const n=st.n, gn=pStats(p.id).n, rc=i===0?'r1':i===1?'r2':i===2?'r3':'rn';
      const barW = n ? (scD/10*100).toFixed(1) : 0;

      return`<tr>
        <td><span class="${rc}">${String(i+1).padStart(2,'0')}</span></td>
        <td><b style="${gn>=40?'color:var(--green)':'color:#ffffff'}">${p.nick}</b></td>
        <td style="min-width:110px">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:${n&&scoreStatus?scoreStatus.color:'var(--gray)'};line-height:1">
            ${n?scD:'—'}<span style="font-size:11px;font-weight:400;color:var(--gray)"> / 10</span>
          </div>
          ${n?`<div style="background:var(--bg2);height:5px;border-radius:2px;margin-top:4px;width:90px">
            <div style="width:${barW}%;height:100%;background:linear-gradient(90deg,${scoreStatus.color}99,${scoreStatus.color});border-radius:2px;transition:width 0.4s"></div>
          </div>
          <div style="font-size:9px;color:var(--gray);margin-top:2px">${(scD/10*100).toFixed(1)}% do máx.</div>`:''}
        </td>
        <td>
          ${n?`<span style="display:inline-flex;align-items:center;padding:3px 8px;border-radius:2px;font-size:10px;font-weight:700;letter-spacing:0.08em;background:${scoreStatus.bg};color:${scoreStatus.color};border:1px solid ${scoreStatus.color}44">${scoreStatus.label}</span>`:'<span style="color:var(--gray);font-size:11px">—</span>'}
        </td>
        <td>${n?fmtNum(medias.dano):'-'}</td>
        <td>${n?medias.kills.toFixed(2):'-'}</td>
        <td>${n?medias.salv.toFixed(2):'-'}</td>
        <td>${n?medias.sup.toFixed(2):'-'}</td>
        <td>${n?medias.col.toFixed(1):'-'}</td>
        <td>${n}</td>
        <td><span class="badge ${gn>=40?'badge-apto':'badge-napto'}">${gn>=40?'APTO':'N.APTO'}</span></td>
      </tr>`;}).join('')}
    </tbody></table></div></div>`;
}

// CALENDAR

function pgCalendar(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const mn=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dn=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  const first=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate(),td=now.getDate();
  let cells=dn.map(d=>`<div class="cal-hdr">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells+=`<div></div>`;
  for(let d=1;d<=total;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=EVENTS.filter(e=>e.data===ds);
    cells+=`<div class="cal-day${d===td?' today':''}${evs.length?' has-ev':''}" onclick="showDayEvs('${ds}')">
      <div class="cal-dn">${d}</div>${evs.slice(0,2).map(e=>`<div class="cal-dot">${e.titulo}</div>`).join('')}
    </div>`;
  }
  return`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <h2 style="font-size:26px;font-weight:900;letter-spacing:0.05em;text-transform:uppercase">${mn[m]} ${y}</h2>
    <button class="btn btn-primary" onclick="modalAddEvent()"><i class="fas fa-plus"></i> Novo Evento</button>
  </div>
  <div class="fcard"><div class="cal-grid">${cells}</div></div>
  ${EVENTS.length===0?`<div class="empty"><i class="fas fa-calendar-alt"></i><h3>Sem Eventos</h3><p>Adicione scrims e campeonatos.</p></div>`:`
  <div class="tw"><table class="tbl"><thead><tr><th>Data</th><th>Evento</th><th>Tipo</th><th>Descrição</th><th>Ações</th></tr></thead>
  <tbody>${EVENTS.sort((a,b)=>a.data.localeCompare(b.data)).map(e=>`<tr>
    <td style="font-family:'Barlow Condensed',sans-serif;font-weight:700">${e.data}</td>
    <td>${e.titulo}</td><td><span class="badge badge-apto">${e.tipo.toUpperCase()}</span></td>
    <td style="color:var(--gray);font-size:12px">${e.descricao||'-'}</td>
    <td style="display:flex;gap:6px">
      <button class="btn btn-icon" onclick="modalEditEvent(${e.id})"><i class="fas fa-edit"></i></button>
      <button class="btn btn-danger" onclick="delEvent(${e.id})"><i class="fas fa-trash"></i></button>
    </td></tr>`).join('')}
  </tbody></table></div>`}`;
}

let rp_pfilt='', rp_mfilt='';
function pgReports(){
  // Pega os valores dos selects se já existirem, senão usa os globals
  const psel=document.getElementById('rp-ps');
  const msel=document.getElementById('rp-ms');
  if(psel) rp_pfilt=psel.value;
  if(msel) rp_mfilt=msel.value;
  const pfilt=rp_pfilt;
  const mfilt=rp_mfilt;
  function fStats(pid){
    let dano=0,kills=0,salv=0,sup=0,col=0,n=0;
    MATCHES.filter(m=>!mfilt||m.mapa===mfilt).forEach(m=>(m.estatisticas||[]).forEach(s=>{
      if(+s.jogador_id===+pid){dano+=+s.dano;kills+=+s.kills;salv+=+s.salvamentos;sup+=+s.suportes;col+=+s.colocacao;n++}
    }));
    return{dano,kills,salv,sup,col,n};
  }
  const ps=pfilt?PLAYERS.filter(p=>+p.id===+pfilt):PLAYERS;
  const rows=ps.map(p=>{
    const st=fStats(p.id),apt=pStats(p.id).n>=40;
    if(!st.n)return`<div class="rp-section"><div class="rp-hdr"><span class="rp-name">${p.nick}</span><span class="badge badge-napto">Sem dados</span></div><div style="padding:12px 18px;font-size:12px;color:var(--gray)">Nenhuma partida${mfilt?' neste mapa':''}.</div></div>`;
    return`<div class="rp-section">
      <div class="rp-hdr"><span class="rp-name" style="${apt?'color:var(--green)':'color:#ffffff'}">${p.nick}</span>
      <div style="display:flex;align-items:center;gap:10px"><span style="font-size:11px;color:var(--gray)">${st.n} partida(s)</span><span class="badge ${apt?'badge-apto':'badge-napto'}">${apt?'APTO':'NÃO APTO'}</span></div></div>
      <div class="rp-grid">
        <div class="rp-stat"><div class="rp-stat-label">Score (Geral)</div><div class="rp-stat-val" style="color:var(--accent)">${(calcRanking(MATCHES).find(x=>+x.id===+p.id)?.score??0)}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Dano Total</div><div class="rp-stat-val">${fmtNum(st.dano)}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Dano/Pt</div><div class="rp-stat-val" style="color:var(--gold)">${fmtNum(st.dano/st.n)}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Total Kills</div><div class="rp-stat-val" style="color:var(--gold)">${st.kills}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Kills/Pt</div><div class="rp-stat-val">${(st.kills/st.n).toFixed(2)}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Salvamentos</div><div class="rp-stat-val" style="color:var(--cyan)">${st.salv}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Salv./Pt</div><div class="rp-stat-val">${(st.salv/st.n).toFixed(2)}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Suportes</div><div class="rp-stat-val">${st.sup}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Col. Média</div><div class="rp-stat-val">${(st.col/st.n).toFixed(1)}</div></div>
        <div class="rp-stat"><div class="rp-stat-label">Partidas</div><div class="rp-stat-val">${st.n}</div></div>
      </div>
    </div>`;
  }).join('');
  return`
  <div class="fcard"><div class="fgrid" style="align-items:flex-end">
    <div class="fg"><label>Jogador</label><select class="fselect" id="rp-ps" onchange="filterReports()"><option value="">Todos</option>${PLAYERS.map(p=>`<option value="${p.id}" ${pfilt==p.id?'selected':''}>${p.nick}</option>`).join('')}</select></div>
    <div class="fg"><label>Mapa</label><select class="fselect" id="rp-ms" onchange="filterReports()"><option value="">Todos</option><option ${mfilt==='Erangel'?'selected':''}>Erangel</option><option ${mfilt==='Miramar'?'selected':''}>Miramar</option><option ${mfilt==='Rondo'?'selected':''}>Rondo</option></select></div>
  </div></div>
  ${MATCHES.length===0?`<div class="empty"><i class="fas fa-chart-bar"></i><h3>Sem Dados</h3><p>Registre partidas para ver relatórios.</p></div>`:`
  <div class="sec-hdr"><div class="sec-title"><div class="sec-title-line"></div>Estatísticas por Jogador${mfilt?' - '+mfilt:''}</div></div>
  ${rows}
  <div class="sec-hdr" style="margin-top:24px"><div class="sec-title"><div class="sec-title-line"></div>Comparativo - Dano Médio</div></div>
  <div class="chart-card"><div style="position:relative;height:260px"><canvas id="rptChart"></canvas></div></div>`}`;
}

function filterReports(){
  rp_pfilt = document.getElementById('rp-ps')?.value||'';
  rp_mfilt = document.getElementById('rp-ms')?.value||'';
  // Re-render only the results section, not the whole page
  const main = document.getElementById('mainContent');
  if(main) main.innerHTML = pgReports();
  setTimeout(()=>initCharts('reports'),80);
}

// HISTORY

function pgHistory(){
  // Agrupa partidas por mês
  const byMonth={};
  MATCHES.forEach(m=>{
    const mk=m.data?.slice(0,7)||'?';
    if(!byMonth[mk])byMonth[mk]={matches:[],players:PLAYERS};
    byMonth[mk].matches.push(m);
  });
  const keys=Object.keys(byMonth).sort().reverse();
  if(!keys.length) return`<div class="empty"><i class="fas fa-archive"></i><h3>Sem Histórico</h3><p>Registre partidas para ver o histórico aqui.</p></div>`;
  return`
  <div class="alert alert-info"><i class="fas fa-info-circle"></i> Histórico de partidas por mês. Toque em um mês para ver o ranking.</div>
  <div class="cards-row" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
    ${keys.map(k=>{const arc=byMonth[k],total=arc.matches.reduce((a,m)=>a+(m.estatisticas?.length||0),0);
    return`<div class="sc" style="cursor:pointer;--sc-color:var(--purple2)" onclick="viewArc('${k}')">
      <div class="sc-label">${fmtMonthKey(k)}</div>
      <div class="sc-val" style="font-size:22px">${total}</div>
      <div class="sc-sub">${arc.matches.length} scrim(s)</div>
      <i class="fas fa-folder-open sc-ico"></i></div>`;}).join('')}
  </div>
  <div id="arc-view" style="margin-top:24px"></div>`;
}

function viewArc(mk){
  const byMonth={};
  MATCHES.forEach(m=>{const k=m.data?.slice(0,7)||'?';if(!byMonth[k])byMonth[k]=[];byMonth[k].push(m);});
  const ms=byMonth[mk]||[];
  const arcRk=calcRanking(ms);
  const total=ms.reduce((a,m)=>a+(m.estatisticas?.length||0),0);
  const best=arcRk.find(p=>p.st.n>0);
  const aptos=arcRk.filter(p=>p.st.n>=40).length;
  const el=document.getElementById('arc-view');
  if(el) el.innerHTML=`
  <div style="background:var(--bg1);border:1px solid var(--border2);margin-bottom:20px">
    <div style="padding:16px 22px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(109,40,217,0.15),rgba(29,78,216,0.08));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase">${fmtMonthKey(mk)}</div>
        <div style="font-size:12px;color:var(--gray);margin-top:2px">${total} partidas · ${ms.length} scrims · ${aptos} aptos</div>
      </div>
      ${best?`<div style="text-align:right"><div style="font-size:10px;color:var(--gray);letter-spacing:0.15em;text-transform:uppercase">MVP</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--gold)">${best.nick}</div>
      <div style="font-size:11px;color:var(--gray)">${best.scoreDisplay} pts</div></div>`:''}
    </div>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Jogador</th><th>Score</th><th>Dano/Pt</th><th>Kills/Pt</th><th>Salv./Pt</th><th>Col.Média</th><th>Partidas</th><th>Status</th></tr></thead>
    <tbody>${arcRk.map((p,i)=>{const rc=i===0?'r1':i===1?'r2':i===2?'r3':'rn';
    const n=p.st.n;
    return`<tr><td><span class="${rc}">${String(i+1).padStart(2,'0')}</span></td>
    <td><b style="${n>=40?'color:var(--green)':'color:#ffffff'}">${p.nick}</b></td>
    <td><span class="score-val">${n?p.scoreDisplay:'-'}</span></td>
    <td>${n?fmtNum(p.medias?.dano??0):'-'}</td><td>${n?(p.medias?.kills??0).toFixed(2):'-'}</td>
    <td>${n?(p.medias?.salv??0).toFixed(2):'-'}</td><td>${n?(p.medias?.col??0).toFixed(1):'-'}</td>
    <td>${n}/40${n<40&&n>0?`<div class="pbar"><div class="pfill" style="width:${Math.min(100,n/40*100).toFixed(0)}%"></div></div>`:''}</td>
    <td><span class="badge ${n>=40?'badge-apto':'badge-napto'}">${n>=40?'APTO':'NÃO APTO'}</span></td></tr>`;}).join('')}
    </tbody></table></div>
  </div>`;
  setTimeout(()=>el?.scrollIntoView({behavior:'smooth',block:'start'}),50);
}

function initCharts(page){
  // Força cor branca em todos os textos do Chart.js globalmente
  if(window.Chart){
    Chart.defaults.color = '#E5E5E5';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
  }
  if(page==='dashboard'&&MATCHES.length>0){
    const mc={};
    MATCHES.forEach(m=>{if(m.mapa){mc[m.mapa]=(mc[m.mapa]||0)+1;}});
    const mCtx=document.getElementById('mapChart');
    const MAP_COLORS={Erangel:'#00D084',Miramar:'#FF6B35',Rondo:'#FFD700',Sanhok:'#00B8FF',Vikendi:'#8A5CFF',Livik:'#FF4D94',Taego:'#FFFFFF'};
    const mapLabels=Object.keys(mc).filter(k=>mc[k]>0);
    const mapData=mapLabels.map(k=>mc[k]);
    const mapBg=mapLabels.map(k=>MAP_COLORS[k]||'#888');
    const mapHover=mapLabels.map(k=>(MAP_COLORS[k]||'#888')+'ee');
    if(mCtx)chartInstances.map=new Chart(mCtx,{type:'doughnut',data:{labels:mapLabels,datasets:[{data:mapData,backgroundColor:mapBg,hoverBackgroundColor:mapHover,borderColor:'rgba(0,0,0,0.55)',borderWidth:2,hoverBorderColor:'rgba(255,255,255,0.25)',hoverBorderWidth:3,hoverOffset:10}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#E5E5E5',font:{size:12,family:"'Barlow Condensed',sans-serif",weight:'700'},padding:16,usePointStyle:true,pointStyleWidth:10,generateLabels:chart=>{const ds=chart.data.datasets[0];return chart.data.labels.map((label,i)=>{const total=ds.data.reduce((a,b)=>a+b,0);const pct=total?((ds.data[i]/total)*100).toFixed(0):0;return{text:`${label}  ${ds.data[i]}x (${pct}%)`,fillStyle:ds.backgroundColor[i],strokeStyle:'transparent',hidden:false,index:i};});}}},tooltip:{callbacks:{label:ctx=>{const total=ctx.dataset.data.reduce((a,b)=>a+b,0);const pct=total?((ctx.parsed/total)*100).toFixed(1):0;return ` ${ctx.label}: ${ctx.parsed} partida(s) — ${pct}%`;},labelColor:ctx=>({borderColor:'transparent',backgroundColor:mapBg[ctx.dataIndex],borderRadius:3})}},},cutout:'60%'}});
    const pw=PLAYERS.filter(p=>pStats(p.id).n>0);
    const dCtx=document.getElementById('dmgChart');
    if(dCtx&&pw.length)chartInstances.dmg=new Chart(dCtx,{type:'bar',data:{labels:pw.map(p=>p.nick),datasets:[{label:'Dano Médio',data:pw.map(p=>{const st=pStats(p.id);return+(st.dano/st.n).toFixed(0)}),backgroundColor:pw.map(p=>pStats(p.id).n>=40?'rgba(184,134,11,0.75)':'rgba(239,68,68,0.5)'),borderColor:pw.map(p=>pStats(p.id).n>=40?'#FFD700':'#EF4444'),borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'rgba(255,215,0,0.06)'},ticks:{color:'#E5E5E5'}},x:{grid:{display:false},ticks:{color:'#E5E5E5',font:{size:11}}}}}});

  if(page==='profile'||page==='player-profile')initProfileCharts(window._viewingPlayerId||CURRENT_USER?.pid);
  if(page==='reports'&&MATCHES.length>0){
    const mfilt=document.getElementById('rp-ms')?.value||'';

    const pw=(pfilt?PLAYERS.filter(p=>+p.id===+pfilt):PLAYERS).filter(p=>{let n=0;MATCHES.filter(m=>!mfilt||m.mapa===mfilt).forEach(m=>(m.estatisticas||[]).forEach(s=>{if(+s.jogador_id===+p.id)n++}));return n>0});

  }
}


// ============================================================
// HELPER — URL do avatar (prioridade: GitHub URL > localStorage legado)
// ============================================================
function getAvatarSrc(player){
  if(!player) return '';
  // URL pública do GitHub (funciona em qualquer dispositivo)
  if(player.avatar_url && !player.avatar_url.startsWith('data:')) return player.avatar_url;
  // Fallback: localStorage (legado — só funciona no dispositivo que salvou)
  try{ return localStorage.getItem('fv_avatar_'+player.id)||''; }catch(e){ return ''; }
}

function avatarHtml(player, size=42, fontSize=14){
  const src = getAvatarSrc(player);
  const initials = (player.nick||'??').replace('FV ','').slice(0,2).toUpperCase();
  const circleStyle = 'width:'+size+'px;height:'+size+'px;min-width:'+size+'px;min-height:'+size+'px;'
    +'border-radius:50%;overflow:hidden;flex-shrink:0;'
    +'background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(0,0,0,0));'
    +'border:1px solid rgba(255,215,0,0.35);';
  if(src){
    return '<div style="'+circleStyle+'">'
      +'<img src="'+src+'" style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block;">'
      +'</div>';
  }
  return '<div style="'+circleStyle+'display:flex;align-items:center;justify-content:center;">'
    +'<span style="font-family:Barlow Condensed,sans-serif;font-size:'+fontSize+'px;font-weight:900;color:var(--gold);line-height:1;">'+initials+'</span>'
    +'</div>';
}

// Avatar grande para cabeçalho de perfil (90px)
function profileAvatarHtml(player){
  const src = getAvatarSrc(player);
  const initials = (player.nick||'??').replace('FV ','').slice(0,2).toUpperCase();
  const wrapStyle = 'width:90px;height:90px;min-width:90px;min-height:90px;'
    +'border-radius:50%;overflow:hidden;flex-shrink:0;'
    +'background:linear-gradient(135deg,rgba(255,215,0,0.3),rgba(255,215,0,0.05));'
    +'border:2px solid rgba(255,215,0,0.4);';
  if(src){
    return '<div class="pf-avatar" style="'+wrapStyle+'">'
      +'<img src="'+src+'" style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block;">'
      +'</div>';
  }
  return '<div class="pf-avatar" style="'+wrapStyle+'display:flex;align-items:center;justify-content:center;">'
    +'<span style="font-family:Barlow Condensed,sans-serif;font-size:34px;font-weight:900;color:var(--gold);line-height:1;">'+initials+'</span>'
    +'</div>';
}

let _profileFilter = '7d'; // '7d' | '30d' | 'all'

  if(isAdmin()){

  }
  const pid = CURRENT_USER.pid;
  const player = PLAYERS.find(p=>+p.id===+pid);
  if(!player){return`<div class="empty"><i class="fas fa-exclamation-triangle"></i><h3>Jogador não encontrado</h3><p>Dados do perfil indisponíveis.</p></div>`;}

  // Stats completos
  const stAll = pStats(pid);
  const rkAll = calcRanking(MATCHES);
  const rkW   = calcRanking(getWeekFilter());
  const rkM   = calcRanking(getMonthFilter());
  const posG  = rkAll.findIndex(p=>+p.id===+pid)+1||'-';
  const posS  = rkW.findIndex(p=>+p.id===+pid)+1||'-';
  const posM  = rkM.findIndex(p=>+p.id===+pid)+1||'-';
  const rkP   = rkAll.find(p=>+p.id===+pid);
  const sc    = rkP?.score??0;
  const scD   = rkP?.scoreDisplay??scoreToDisplay(sc);
  const med   = rkP?.medias??{dano:0,kills:0,salv:0,sup:0,col:0};
  const contrib= rkP?.contrib??{dano:0,salv:0,kills:0,sup:0};
  const ss    = rkP?.scoreStatus??{label:'—',color:'#888',bg:'rgba(128,128,128,0.1)'};
  const apt   = stAll.n>=40;
  const W     = SCORE_WEIGHTS;
  const scoreMax = 10;
  const scorePct = scD?(scD/10*100).toFixed(1):0;

  // Stats por mapa
  const MAP_COLORS={Erangel:'#00D084',Miramar:'#FF6B35',Rondo:'#FFD700',Sanhok:'#00B8FF',Vikendi:'#8A5CFF',Livik:'#FF4D94',Taego:'#FFFFFF'};
  const mapas = [...new Set(MATCHES.map(m=>m.mapa).filter(Boolean))];
  const mapStats = mapas.map(mapa=>{
    const ms = MATCHES.filter(m=>m.mapa===mapa);
    const st = pStats(pid, ms);
    return {mapa, n:st.n, dano:st.n?+(st.dano/st.n).toFixed(0):0, kills:st.n?+(st.kills/st.n).toFixed(2):0, salv:st.n?+(st.salv/st.n).toFixed(2):0, sup:st.n?+(st.sup/st.n).toFixed(2):0};
  }).filter(m=>m.n>0).sort((a,b)=>b.n-a.n);
  const bestMap = mapStats.reduce((best,m)=>{

  // Conquistas preparadas

function initProfileCharts(overridePid){
  const pid = overridePid || CURRENT_USER?.pid;
  if(!pid) return;

  // Filtra partidas pelo período selecionado
  const now=new Date();
  let ms=MATCHES;
  if(_profileFilter==='7d'){
    const d7=new Date(now); d7.setDate(now.getDate()-7);
    ms=MATCHES.filter(m=>new Date(m.data)>=d7);
  } else if(_profileFilter==='30d'){
    const d30=new Date(now); d30.setDate(now.getDate()-30);
    ms=MATCHES.filter(m=>new Date(m.data)>=d30);
  }

  // Pega partidas em que o jogador participou, ordenadas por data
  const ptidas=ms.filter(m=>(m.estatisticas||[]).some(s=>+s.jogador_id===+pid))
    .sort((a,b)=>new Date(a.data)-new Date(b.data));

  const labels=ptidas.map((m,i)=>m.data||`#${i+1}`);
  const dmgs=ptidas.map(m=>{const s=(m.estatisticas||[]).find(s=>+s.jogador_id===+pid);return s?+s.dano:0;});
  const kills=ptidas.map(m=>{const s=(m.estatisticas||[]).find(s=>+s.jogador_id===+pid);return s?+s.kills:0;});

  // Score por partida: normaliza contra toda a temporada
  const rkAll=calcRanking(MATCHES);
  const maxDano=Math.max(...rkAll.map(p=>p.medias.dano),1);
  const maxKills=Math.max(...rkAll.map(p=>p.medias.kills),1);
  const maxSalv=Math.max(...rkAll.map(p=>p.medias.salv),1);
  const maxSup=Math.max(...rkAll.map(p=>p.medias.sup),1);
  const W=SCORE_WEIGHTS;
  const scoreMax=W.dano+W.salvamentos+W.kills+W.suportes;
  const scores=ptidas.map(m=>{
    const s=(m.estatisticas||[]).find(s=>+s.jogador_id===+pid);
    if(!s)return 0;
    return parseFloat((
      (s.dano/maxDano)*W.dano+
      (s.salvamentos/maxSalv)*W.salvamentos+
      (s.kills/maxKills)*W.kills+
      (s.suportes/maxSup)*W.suportes
    ).toFixed(2));
  });

  const chartOpts=(label,data,color)=>({
    type:'line',
    data:{labels,datasets:[{label,data,borderColor:color,backgroundColor:color+'22',borderWidth:2,fill:true,tension:0.4,pointRadius:ptidas.length<=20?3:0,pointHoverRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{
      y:{grid:{color:'rgba(255,215,0,0.05)'},ticks:{color:'#E5E5E5',font:{size:10}}},
      x:{grid:{display:false},ticks:{color:'#E5E5E5',font:{size:9},maxTicksLimit:6,maxRotation:0}}
    }}
  });

  ['pfDmgChart','pfKillChart','pfScoreChart'].forEach(id=>{
    if(chartInstances[id]){try{chartInstances[id].destroy();}catch(e){}}
  });

  const dCtx=document.getElementById('pfDmgChart');
  const kCtx=document.getElementById('pfKillChart');
  const sCtx=document.getElementById('pfScoreChart');

  if(ptidas.length===0){
    [dCtx,kCtx,sCtx].forEach(c=>{if(c){const p=c.parentElement;p.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--gray);font-size:12px">Sem dados no período</div>';}});
    return;
  }

  if(dCtx) chartInstances['pfDmgChart']=new Chart(dCtx,chartOpts('Dano',dmgs,'#FF6B35'));
  if(kCtx) chartInstances['pfKillChart']=new Chart(kCtx,chartOpts('Kills',kills,'#FFD700'));
  if(sCtx) chartInstances['pfScoreChart']=new Chart(sCtx,chartOpts('Score',scores,'#00D084'));
}

// ============================================================
// FOTOS DE PARTIDA — upload real para GitHub (igual aos avatares)
// Caminho: Dados/matches/{matchId}_{slot}.jpg
// URL pública: https://raw.githubusercontent.com/{owner}/{repo}/main/Dados/matches/{id}_{slot}.jpg
// ============================================================

async function compressMatchPhoto(dataUrl, maxSizeKB=400, quality=0.80){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX_DIM = 1280;
      let w=img.width, h=img.height;
      if(w>MAX_DIM||h>MAX_DIM){
        if(w>h){h=Math.round(h*MAX_DIM/w);w=MAX_DIM;}
        else{w=Math.round(w*MAX_DIM/h);h=MAX_DIM;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      let q=quality;
      let result=canvas.toDataURL('image/jpeg',q);
      while(result.length>maxSizeKB*1366&&q>0.4){q-=0.05;result=canvas.toDataURL('image/jpeg',q);}
      resolve(result);
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

async function ghUploadMatchPhoto(matchId, slot, dataUrl){
  const path='Dados/matches/'+matchId+'_'+slot+'.jpg';
  const publicUrl='https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/main/'+path+'?v='+Date.now();
  const compressed=await compressMatchPhoto(dataUrl);
  const base64Data=compressed.split(',')[1];
  let existingSha=null;
  try{
    const check=await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{
      headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json'}
    });
    if(check.ok){const j=await check.json();existingSha=j.sha;}
  }catch(e){}
  const body={message:'match photo '+matchId+' '+slot+' '+Date.now(),content:base64Data};
  if(existingSha) body.sha=existingSha;
  const r=await fetch(GH_API+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{
    method:'PUT',
    headers:{'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){const t=await r.text();throw new Error('Upload foto falhou: '+t);}
  return publicUrl;
}

// Fallback: salva base64 no localStorage para uso imediato antes do GitHub confirmar
function savePhotoLocal(base64DataUrl, matchId, slot){
  try{ localStorage.setItem('fv_photo_'+matchId+'_'+slot, base64DataUrl); }
  catch(e){ console.warn('Foto não salva localmente:', e.message); }
}
function getPhotoLocal(matchId, slot){
  try{ return localStorage.getItem('fv_photo_'+matchId+'_'+slot); }
  catch(e){ return null; }
}

// Resolve URL final da foto: GitHub URL > localStorage > null
function resolveMatchPhoto(url, matchId, slot){
  if(!url && !matchId) return null;
  // URL pública do GitHub (funciona em qualquer dispositivo)
  if(url && url.startsWith('http')) return url;
  // Fallback local (só funciona no dispositivo que salvou)

}

async function lerPrints(){
  if(!uPhotos.foto1 && !uPhotos.foto2){ alert('Suba pelo menos um print primeiro!'); return; }
  const status = document.getElementById('ai-status');
  status.style.display='block'; status.style.color='var(--gray)';
  status.innerHTML='<span class="spinner"></span> Analisando prints com IA...';
  try {
    const prompt = `Você é um especialista em PUBG Mobile. Analise estes prints e extraia os dados.

JOGADORES DO TIME: ${PLAYERS.map(p=>p.nick).join(', ')}

Retorne APENAS JSON válido, sem markdown, sem texto extra:
{"colocacao":10,"mapa":"Miramar","jogadores":[{"nick":"FV Luke","kills":3,"dano":456,"salvamentos":0,"suportes":2}]}

Regras:
- colocacao: posição final da equipe (número inteiro)
- mapa: Erangel, Miramar ou Rondo (detecte pelo visual)
- nick: use o nick mais próximo da lista acima
- dano: coluna Dano/Damage (inteiro)
- kills: coluna Abates/Kills (inteiro)
- salvamentos: coluna Resgatar/Rescue (inteiro)
- suportes: coluna Assistências/Assists (inteiro)
- Inclua TODOS os jogadores visíveis
- Use 0 para campos não visíveis`;

    const parts = [{ text: prompt }];
    for(const slot of ['foto1','foto2']){
      if(!uPhotos[slot]) continue;
      const mime = (uPhotos[slot].match(/^data:(image\/[a-zA-Z+]+);/)||[,'image/jpeg'])[1];
      parts.push({ inline_data:{ mime_type: mime, data: uPhotos[slot].split(',')[1] } });
    }

    const resp = await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + window._gk,
      {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ contents:[{ parts }] })
      }
    );
    const data = await resp.json();
    console.log('[Gemini]', resp.status, JSON.stringify(data).slice(0,300));

    if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));

    const text = data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    const clean = text.replace(/```json\n?/gi,'').replace(/```\n?/gi,'').trim();
    const json = clean.match(/\{[\s\S]*\}/);
    if(!json) throw new Error('IA não retornou dados válidos. Tente novamente.');

    const parsed = JSON.parse(json[0]);
    if(!parsed.jogadores?.length) throw new Error('Nenhum jogador identificado. Preencha manualmente.');

    // Preenche mapa
    if(parsed.mapa){
      const ms=document.getElementById('m-mapa');
      if(ms&&['Erangel','Miramar','Rondo'].includes(parsed.mapa)) ms.value=parsed.mapa;
    }
    // Limpa e preenche jogadores
    sRows.forEach(rid=>document.getElementById('sr-'+rid)?.remove());
    sRows=[];
    parsed.jogadores.forEach(j=>{
      const player = PLAYERS.find(p=>{
        const a=p.nick.toLowerCase().replace(/[^a-z0-9]/g,'');
        const b=j.nick.toLowerCase().replace(/[^a-z0-9]/g,'');
        return a.includes(b)||b.includes(a);
      });
      addSRow();
      const rid=sRows[sRows.length-1];
      if(player){const sel=document.getElementById('sp-'+rid);if(sel)sel.value=player.id;}
      const f=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v||0;};
      f('sd-'+rid,j.dano); f('sk-'+rid,j.kills);
      f('ss-'+rid,j.salvamentos); f('su-'+rid,j.suportes);
      f('sc-'+rid,parsed.colocacao||1);
    });

    status.innerHTML='<i class="fas fa-check-circle" style="color:var(--green)"></i> '
      +parsed.jogadores.length+' jogador(es) encontrado(s). Confira os dados e salve!';
    status.style.color='var(--green)';
  } catch(e){
    console.error('[lerPrints]',e);
    status.innerHTML='<i class="fas fa-exclamation-triangle"></i> '+e.message;
    status.style.color='var(--red)';
  }
}

async function saveMatch(){
  const data=document.getElementById('m-data').value;
  const scrim=document.getElementById('m-scrim').value.trim();
  const mapa=document.getElementById('m-mapa').value;
  if(!data){alert('Informe a data.');return}
  if(!sRows.length){alert('Adicione ao menos um jogador.');return}

  const stats=[];
  for(const rid of sRows){
    const el_p=document.getElementById('sp-'+rid);
    const el_d=document.getElementById('sd-'+rid);
    const el_k=document.getElementById('sk-'+rid);
    const el_s=document.getElementById('ss-'+rid);
    const el_u=document.getElementById('su-'+rid);
    const el_c=document.getElementById('sc-'+rid);
    if(!el_p){console.warn('Missing row elements for rid:',rid);continue;}
    stats.push({
      jogador_id:+el_p.value,
      dano:+(el_d?.value)||0,
      kills:+(el_k?.value)||0,
      salvamentos:+(el_s?.value)||0,
      suportes:+(el_u?.value)||0,
      colocacao:+(el_c?.value)||1,
    });
  }
  if(!stats.length){alert('Erro ao ler dados dos jogadores. Tente novamente.');return}

  const newId = Date.now();
  const foto1data = uPhotos.foto1;
  const foto2data = uPhotos.foto2;

  // Salva preview local imediatamente (para exibir antes do GitHub confirmar)
  if(foto1data) savePhotoLocal(foto1data, newId, 'foto1');
  if(foto2data) savePhotoLocal(foto2data, newId, 'foto2');

  const newMatch = {
    id: newId, data, scrim: scrim||null, mapa,
    foto1_url: null, foto2_url: null,
    estatisticas: stats.map(s=>({...s, partida_id: newId}))
  };
  MATCHES = [newMatch, ...MATCHES];
  uPhotos={foto1:null,foto2:null};
  closeModal();
  renderPage('matches', true);
  showToast('Partida salva! Enviando fotos...', 'info', 3000);

  // Upload das fotos para GitHub em background
  let savedFoto1=null, savedFoto2=null;
  try{
    if(foto1data){
      showToast('⬆️ Enviando foto de colocação...','info',5000);
      savedFoto1 = await ghUploadMatchPhoto(newId,'foto1',foto1data);
      console.log('[saveMatch] foto1 enviada:',savedFoto1);
    }
    if(foto2data){
      showToast('⬆️ Enviando foto de estatísticas...','info',5000);
      savedFoto2 = await ghUploadMatchPhoto(newId,'foto2',foto2data);
      console.log('[saveMatch] foto2 enviada:',savedFoto2);
    }
  }catch(e){
    console.warn('[saveMatch] Upload foto falhou:',e.message);
    showToast('⚠️ Fotos salvas localmente (sem acesso ao GitHub: '+e.message+')','warn',7000);
  }

  // Atualiza partida com URLs públicas
  MATCHES = MATCHES.map(m=>{
    if(+m.id!==+newId) return m;
    return {...m, foto1_url: savedFoto1||m.foto1_url, foto2_url: savedFoto2||m.foto2_url};
  });
  saveCache();

  try{
    await persistAll();
    showToast('✅ Partida e fotos sincronizadas!','success');
  }catch(e){
    console.error('[saveMatch] persistAll falhou:',e);
    showToast('❌ Erro ao sincronizar: '+e.message,'warn',6000);
  }
}

      kills:       +(document.getElementById('sk-'+rid)?.value)||0,
      salvamentos: +(document.getElementById('ss-'+rid)?.value)||0,
      suportes:    +(document.getElementById('su-'+rid)?.value)||0,
      colocacao:   +(document.getElementById('sc-'+rid)?.value)||1,
      partida_id:  +id
    });
  }
  if(!stats.length){ alert('Erro ao ler dados. Tente novamente.'); return; }

  // Upload de novas fotos se enviadas
  const m = MATCHES.find(x=>+x.id===+id);
  let foto1_url = m?.foto1_url || null;
  let foto2_url = m?.foto2_url || null;

  closeModal();
  showToast('Salvando alterações...', 'info', 2500);

  if(uPhotos.foto1){
    try{ foto1_url = await ghUploadMatchPhoto(id,'foto1',uPhotos.foto1); }
    catch(e){ console.warn('Upload foto1 falhou:',e); }
  }
  if(uPhotos.foto2){
    try{ foto2_url = await ghUploadMatchPhoto(id,'foto2',uPhotos.foto2); }
    catch(e){ console.warn('Upload foto2 falhou:',e); }
  }

  MATCHES = MATCHES.map(x => +x.id===+id
    ? {...x, data, scrim:scrim||null, mapa, foto1_url, foto2_url, estatisticas: stats}
    : x
  );
  saveCache();
  renderPage('matches', true);

  try{
    await persistAll();
    showToast('✅ Partida atualizada!', 'success');
  } catch(e){
    showToast('❌ Erro ao sincronizar: '+e.message, 'warn', 6000);
  }
}

function delMatch(id){
  const match = MATCHES.find(m=>+m.id===+id);
  if(!match){ alert('Partida não encontrada.'); return; }
  const dataFmt = match.data || '';
  const mapa = match.mapa || '';
  const nJog = (match.estatisticas||[]).length;
  openModal('Excluir Partida',
    `<div style="text-align:center;padding:10px 0 20px">
      <div style="font-size:42px;margin-bottom:16px">🗑️</div>
      <p style="font-size:15px;font-weight:600;margin-bottom:10px;color:var(--white)">Tem certeza que deseja excluir esta partida?</p>
      <div style="background:#111;border:1px solid rgba(255,215,0,0.15);border-radius:2px;padding:12px 16px;margin:14px 0;text-align:left">
        <div style="font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:6px">Partida a excluir</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700">${dataFmt} — <span class="badge badge-map map-${mapa}">${mapa}</span></div>
        <div style="font-size:12px;color:var(--gray);margin-top:5px">${nJog} jogador(es) com estatísticas</div>
      </div>
      <p style="font-size:12px;color:var(--red);letter-spacing:0.03em"><i class="fas fa-exclamation-triangle"></i> Essa ação não poderá ser desfeita.</p>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()"><i class="fas fa-times"></i> Cancelar</button>
     <button class="btn btn-danger" style="padding:9px 18px;font-size:12px;font-weight:800" onclick="confirmDelMatch(${id})"><i class="fas fa-trash"></i> Sim, excluir</button>`
  );
}

function confirmDelMatch(id){
  // Garante que a partida ainda existe antes de excluir
  if(!MATCHES.find(m=>+m.id===+id)){ closeModal(); return; }
  // Remove do array local imediatamente
  MATCHES = MATCHES.filter(m=>+m.id!==+id);
  // Limpa cache e persiste estado atualizado
  saveCache();
  closeModal();
  // Re-renderiza a página de partidas com dados atualizados
  renderPage('matches', true);
  // Persiste exclusão no GitHub
  syncBg(()=>persistAll());
}
